syntax = "proto3";

package auth;

option go_package = "github.com/fk4peace/golang_services/shared/grpc_proto/auth;auth_proto";

service Auth {
  rpc GetPersonRolesById(getPersonRolesByIdRequest)
      returns (getPersonRolesByIdResponse);
}

message getPersonRolesByIdRequest { int64 personId = 1; }

message getPersonRolesByIdResponse { repeated string roles = 1; }